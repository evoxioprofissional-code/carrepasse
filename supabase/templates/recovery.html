<!-- Assunto: Car Repasse: crie uma nova senha -->
<!-- Aplicar em Auth > Email Templates > Reset Password depois de configurar o SMTP (Resend). -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;color:#15171A">
  <h2 style="margin:0 0 12px">Crie uma nova senha</h2>
  <p>Recebemos um pedido para redefinir a senha da sua conta no <strong>Car Repasse</strong>.</p>
  <p style="margin:24px 0">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/redefinir-senha"
       style="background:#7ED321;color:#15171A;padding:12px 20px;border-radius:8px;font-weight:bold;text-decoration:none;display:inline-block">
      Criar nova senha
    </a>
  </p>
  <p style="color:#5E6570;font-size:14px">O link vale por 1 hora e só pode ser usado uma vez. Se não foi você que pediu, ignore este e-mail: sua senha continua a mesma.</p>
  <p style="color:#5E6570;font-size:13px">Car Repasse — Preço baixo. Verdade sempre.</p>
</div>
